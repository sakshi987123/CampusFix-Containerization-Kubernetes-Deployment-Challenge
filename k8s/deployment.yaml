apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusfix
  labels:
    app: campusfix
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: campusfix
  template:
    metadata:
      labels:
        app: campusfix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: campusfix
          image: campusfix:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            - name: CAMPUSFIX_DB
              value: /data/campusfix.db
            - name: UPLOAD_FOLDER
              value: /data/uploads
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: campusfix-secrets
                  key: SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: campusfix-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: campusfix-data
          persistentVolumeClaim:
            claimName: campusfix-data
        - name: tmp
          emptyDir: {}